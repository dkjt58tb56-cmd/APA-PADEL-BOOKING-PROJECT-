<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Profile - Paddle Court</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="page-title">
        <h1>My Profile</h1>
    </div>

    <div class="card">
        <h2>Personal Information</h2>
        <table style="margin-top: 1rem;">
            <tr><th style="width: 200px;">Username</th><td th:text="${user.username}"></td></tr>
            <tr><th>Email</th><td th:text="${user.email}"></td></tr>
            <tr><th>Full Name</th><td th:text="${user.fullName}"></td></tr>
            <tr><th>Phone</th><td th:text="${user.phone ?: 'Not set'}"></td></tr>
            <tr><th>Role</th><td><span class="badge badge-info" th:text="${user.role}"></span></td></tr>
            <tr><th>Member Since</th><td th:text="${#temporals.format(user.createdAt, 'MMMM d, yyyy')}"></td></tr>
        </table>
    </div>

    <div class="card">
        <h2>Activity History</h2>
        <p style="color: #6b7280; margin-bottom: 1rem;">All your recent activities are tracked here</p>

        <div class="empty-state" th:if="${#lists.isEmpty(activityHistory)}">
            <div class="icon">📋</div>
            <p>No activity yet</p>
        </div>

        <table th:if="${not #lists.isEmpty(activityHistory)}">
            <thead>
            <tr>
                <th>Date</th>
                <th>Action</th>
                <th>Description</th>
                <th>IP Address</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="log : ${activityHistory}">
                <td th:text="${#temporals.format(log.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                <td><span class="badge badge-info" th:text="${log.action}"></span></td>
                <td th:text="${log.description}"></td>
                <td th:text="${log.ipAddress}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
