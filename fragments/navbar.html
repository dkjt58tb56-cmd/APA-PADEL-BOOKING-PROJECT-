<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav class="navbar" th:fragment="navbar">
    <a class="logo" href="/">🎾 Paddle Court</a>
    <ul class="nav-links">
        <li sec:authorize="hasRole('USER')"><a href="/user/dashboard">Dashboard</a></li>
        <li sec:authorize="hasRole('USER')"><a href="/user/courts">Courts</a></li>
        <li sec:authorize="hasRole('USER')"><a href="/user/bookings">My Bookings</a></li>
        <li sec:authorize="hasRole('USER')"><a href="/user/profile">Profile</a></li>

        <li sec:authorize="hasRole('ADMIN')"><a href="/admin/dashboard">Dashboard</a></li>
        <li sec:authorize="hasRole('ADMIN')"><a href="/admin/courts">Courts</a></li>
        <li sec:authorize="hasRole('ADMIN')"><a href="/admin/bookings">Bookings</a></li>
        <li sec:authorize="hasRole('ADMIN')"><a href="/admin/users">Users</a></li>
        <li sec:authorize="hasRole('ADMIN')"><a href="/admin/activity">Activity Log</a></li>

        <li sec:authorize="isAuthenticated()">
            <span style="color: #6b7280;">Hi, <span sec:authentication="name"></span></span>
        </li>
        <li sec:authorize="isAuthenticated()">
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-secondary btn-sm">Logout</button>
            </form>
        </li>
    </ul>
</nav>
</body>
</html>
