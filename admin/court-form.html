<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Court Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container" style="max-width: 700px;">
    <div class="page-title">
        <h1 th:text="${editing} ? 'Edit Court' : 'Add New Court'">Court Form</h1>
    </div>

    <div class="card">
        <form th:action="${editing} ? @{|/admin/courts/${courtDto.id}/edit|} : @{/admin/courts/new}"
              th:object="${courtDto}" method="post">

            <div class="form-group">
                <label for="name">Name *</label>
                <input type="text" id="name" th:field="*{name}" class="form-control" required>
                <div class="form-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location" th:field="*{location}" class="form-control">
                <div class="form-error" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="type">Type *</label>
                    <select id="type" th:field="*{type}" class="form-control" required>
                        <option value="">-- Select type --</option>
                        <option value="INDOOR">Indoor</option>
                        <option value="OUTDOOR">Outdoor</option>
                        <option value="COVERED">Covered</option>
                    </select>
                    <div class="form-error" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>
                </div>
                <div class="form-group">
                    <label for="pricePerHour">Price per hour ($) *</label>
                    <input type="number" id="pricePerHour" th:field="*{pricePerHour}"
                           class="form-control" step="0.01" min="0.01" required>
                    <div class="form-error" th:if="${#fields.hasErrors('pricePerHour')}" th:errors="*{pricePerHour}"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}" class="form-control" rows="3"></textarea>
                <div class="form-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            </div>

            <div class="form-group checkbox-row">
                <input type="checkbox" id="available" th:field="*{available}">
                <label for="available">Available for booking</label>
            </div>

            <div style="display:flex; gap:0.5rem;">
                <button type="submit" class="btn btn-primary" th:text="${editing} ? 'Update Court' : 'Create Court'">Save</button>
                <a th:href="@{/admin/courts}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
